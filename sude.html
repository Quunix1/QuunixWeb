<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Seviyorum Sude 💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    font-family:'Comic Sans MS','Segoe UI',cursive;
    background:linear-gradient(
        135deg,
        #ffb3e6,
        #ffc9f2,
        #f4c2ff,
        #d8b4ff,
        #ffb3e6
    );
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    position:relative;
    z-index:100;
    text-align:center;
    padding:50px;
    border-radius:35px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(20px);
    border:2px solid rgba(255,255,255,0.3);
    box-shadow:
        0 0 30px rgba(255,255,255,.6),
        0 0 80px rgba(255,105,180,.35);
}

.title{
    font-size:5rem;
    line-height:1.1;
    color:#ff1493;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff69b4,
        0 0 40px #ff69b4;
    animation:bounce 2s infinite ease-in-out;
}

.subtitle{
    margin-top:15px;
    font-size:1.8rem;
    color:#8b0068;
    font-weight:bold;
}

.big-heart{
    font-size:100px;
    animation:heartbeat 1s infinite;
    margin-bottom:10px;
}

.hearts{
    margin-top:20px;
    font-size:35px;
    letter-spacing:5px;
}

.corner{
    position:absolute;
    font-size:110px;
    opacity:.15;
    z-index:1;
}

.c1{top:10px;left:10px;}
.c2{top:10px;right:10px;}
.c3{bottom:10px;left:10px;}
.c4{bottom:10px;right:10px;}

.floating-heart{
    position:absolute;
    pointer-events:none;
    user-select:none;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(100px) scale(.8);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{
        transform:translateY(-120vh) rotate(360deg) scale(1.3);
        opacity:0;
    }
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

.background-heart{
    position:absolute;
    user-select:none;
    pointer-events:none;
    animation:slowFloat ease-in-out infinite;
}

@keyframes slowFloat{
    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }
}
</style>
</head>

<body>

<div class="corner c1">💖</div>
<div class="corner c2">💕</div>
<div class="corner c3">💗</div>
<div class="corner c4">💜</div>

<div class="card">
    <div class="big-heart">💖</div>

    <h1 class="title">
        Seni Seviyorum<br>
        Sude
    </h1>

    <p class="subtitle">
        Sonsuza kadar seveceğim 💖
    </p>

    <div class="hearts">
        💕 💖 💞 💘 💝 💗 💜 💓
    </div>
</div>

<script>

const emojis = [
    "💖","💕","💗","💞",
    "💓","💘","💝","💜",
    "🌸","✨"
];

/* Ekranın her yerine dağılan kalpler */
for(let i=0;i<120;i++){

    const heart = document.createElement("div");

    heart.className = "background-heart";

    heart.innerHTML =
        emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left = Math.random()*100 + "%";
    heart.style.top = Math.random()*100 + "%";

    heart.style.fontSize =
        (18 + Math.random()*50) + "px";

    heart.style.opacity =
        0.1 + Math.random()*0.4;

    heart.style.animationDuration =
        (3 + Math.random()*6) + "s";

    document.body.appendChild(heart);
}

/* Sürekli yükselen kalpler */
setInterval(()=>{

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    heart.innerHTML =
        emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left =
        Math.random()*100 + "%";

    heart.style.bottom = "-50px";

    heart.style.fontSize =
        (25 + Math.random()*50) + "px";

    heart.style.animationDuration =
        (8 + Math.random()*6) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },15000);

},200);

/* Tıklayınca kalp patlaması */
document.addEventListener("click",(e)=>{

    for(let i=0;i<15;i++){

        const heart =
            document.createElement("div");

        heart.innerHTML =
            emojis[Math.floor(Math.random()*emojis.length)];

        heart.style.position = "absolute";
        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";
        heart.style.fontSize = "35px";
        heart.style.pointerEvents = "none";
        heart.style.zIndex = "9999";

        document.body.appendChild(heart);

        const angle =
            Math.random()*Math.PI*2;

        const distance =
            80 + Math.random()*120;

        heart.animate([
            {
                transform:"translate(0,0) scale(1)",
                opacity:1
            },
            {
                transform:
                `translate(${Math.cos(angle)*distance}px,
                ${Math.sin(angle)*distance}px)
                scale(1.5)`,
                opacity:0
            }
        ],{
            duration:1200,
            easing:"ease-out"
        });

        setTimeout(()=>{
            heart.remove();
        },1200);
    }

});

</script>

</body>
</html>
