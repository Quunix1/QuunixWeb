<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quunix</title>
<meta name="description" content="Eve Gitmem Gerek Her Yerdeyim">
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  user-select: none;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.brand-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.title-glow {
  font-size: 5rem;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 5px;
  text-transform: uppercase;
  animation: pulseGlow 3s infinite ease-in-out;
}

.eye-container {
  width: 100px;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.eye-ball {
  width: 100%;
  height: 100%;
  border: 3px solid #ffffff;
  border-radius: 50% 0;
  transform: rotate(45deg);
  display: flex;
  justify-content: center;
  align-items: center;
  transition: box-shadow 0.3s ease;
}

.pupil {
  width: 32px;
  height: 32px;
  background: #ffffff;
  border-radius: 50%;
}

.eye-container:hover .eye-ball {
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
}

.seo-content {
  display: none;
}

@keyframes pulseGlow {
  0% {
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
    transform: scale(1);
  }
  50% {
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.9), 0 0 50px rgba(255, 255, 255, 0.6);
    transform: scale(1.03);
  }
  100% {
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
    transform: scale(1);
  }
}
</style>
</head>
<body>

  <div class="brand-container">
    <h1 class="title-glow">Quunix</h1>
    
    <div class="eye-container">
      <div class="eye-ball">
        <div class="pupil"></div>
      </div>
    </div>
  </div>

  <div class="seo-content">
    <h2>Quunix</h2>
    <ul>
      <li>Eve Gitmem Gerek Her Yerdeyim</li>
    </ul>
  </div>

</body>
</html>
