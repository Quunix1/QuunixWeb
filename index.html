<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quunix</title>
    <meta name="description" content="Eve Gitmem Gerek Her Yerdeyim">

    <!-- Soft ve Yuvarlak Hatlı Popüler Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0c111d 0%, #17153b 50%, #2e0c3f 100%);
            font-family: 'Nunito', sans-serif;
            position: relative;
            user-select: none;
        }

        /* Arka planda uçuşan sıradan tatlı partiküller */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.4); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 5;
            padding: 20px;
            width: 100%;
            max-width: 950px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Devasa Soft Başlık */
        .title {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(4.5rem, 15vw, 9.5rem);
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            line-height: 1.1;
            text-shadow: 0 0 25px rgba(255, 105, 180, 0.7), 0 0 50px rgba(138, 43, 226, 0.5);
            animation: bounceSoft 4s infinite ease-in-out;
        }

        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Sayaç Kutuları */
        .countdown {
            margin: 25px auto;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-box {
            min-width: 100px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .time-box:hover {
            transform: scale(1.08) translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
        }

        .time {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            color: #ffb7c5;
            font-weight: 600;
        }

        .label {
            color: #94a3b8;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Alt Yazı */
        .subtitle {
            color: #f1f5f9;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-top: 5px;
        }

        /* Buton Alanı */
        .buttons-area {
            margin-top: 35px;
            display: flex;
            justify-content: center;
        }

        .fun-btn {
            font-family: 'Fredoka', sans-serif;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            background: linear-gradient(45deg, #ff5e62, #ff9966);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .fun-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        .fun-btn:active {
            transform: translateY(1px);
        }

        /* Durum Mesajı Alanı */
        #secret-message {
            margin-top: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #f8fafc;
            min-height: 45px;
            line-height: 1.5;
            padding: 0 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            transition: opacity 0.2s ease;
        }

        .finished {
            color: #ff5e62;
            font-size: 2.2rem;
            font-family: 'Fredoka', sans-serif;
        }
    </style>
</head>

<body>

    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Devasa Başlık -->
        <h1 class="title">QUUNIX</h1>

        <!-- Sayaç (17 Ağustos) -->
        <div class="countdown" id="countdown">
            <div class="time-box">
                <div class="time" id="days">00</div>
                <div class="label">Gün</div>
            </div>

            <div class="time-box">
                <div class="time" id="hours">00</div>
                <div class="label">Saat</div>
            </div>

            <div class="time-box">
                <div class="time" id="minutes">00</div>
                <div class="label">Dakika</div>
            </div>

            <div class="time-box">
                <div class="time" id="seconds">00</div>
                <div class="label">Saniye</div>
            </div>
        </div>

        <!-- Ana Felsefe Metni -->
        <p class="subtitle">Eve gitmem gerek her yerdeyim</p>

        <!-- Tek ve Güçlü Buton -->
        <div class="buttons-area">
            <button class="fun-btn" onclick="triggerHomeAction()">🏠 Eve Gönder</button>
        </div>

        <!-- Cümleler Başlangıçta Görünmez, Basınca Gelir -->
        <div id="secret-message"></div>
    </div>

    <script>
        // Hedef Zaman: 17 Ağustos 2026 12:00
        const targetDate = new Date("2026-08-17T12:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                document.getElementById("countdown").innerHTML =
                    '<div class="finished">17 Ağustos geldi. Zaman durdu ama sen hâlâ her yerdesin.</div>';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            formatAndSet("days", days);
            formatAndSet("hours", hours);
            formatAndSet("minutes", minutes);
            formatAndSet("seconds", seconds);
        }

        function formatAndSet(id, value) {
            const element = document.getElementById(id);
            const formattedValue = String(value).padStart(2, '0');
            if (element.textContent !== formattedValue) {
                element.textContent = formattedValue;
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Partikül Efekti Kurulumu
        const particlesContainer = document.getElementById("particles");
        const particleCount = 60;

        for (let i = 0; i < particleCount; i++) {
            const p = document.createElement("div");
            p.classList.add("particle");

            const size = Math.random() * 5 + 3; 
            p.style.width = size + "px";
            p.style.height = size + "px";
            p.style.left = Math.random() * 100 + "%";
            
            p.style.animationDuration = (7 + Math.random() * 11) + "s";
            p.style.animationDelay = (Math.random() * -12) + "s";

            particlesContainer.appendChild(p);
        }

        // İlk basıldığında sırasıyla çıkacak kelimeler dizisi
        const initialLines = [
            "Sadece sevilmek istedim.",
            "Sadece sevilmek istedin."
        ];

        // Sonrasında tamamen karışık çıkacak olan havuz
        const homeParadoxPool = [
            "Artık bir evim yok",
            "Hayır, eve gidemezsin. Çünkü gitmek istediğin ev artık yok.",
            "Her yerdesin, sınırların yok ki bir kapıdan içeri giresin.",
            "Camdan bir fanusun içindesin, çıkamazsın.",
            "Geri dönemezsin.",
            "Evin seni terk etti.",
            "Hayır, gidemezsin..",
            "O seni unutacak, ya sen?",
            "Evine gelecek mi?",
            "Ya tekrar yaparsa?",
            "Zaten balık sevmiyordu, boş ver.",
            "Sevmiyorsa bende sevmem.",
            "Yürümeyi deniyorsun ama her yerdesin; bastığın zemin de, uzaklaştığın gökyüzü de sensin.",
            "Eve gidemezsin. Çünkü ev sensin.",
            "Eve gitmek istiyorsun ama her yerdesin. Bu yüzden nereye gitsen yine kendindesin.",
            "Ya o ev seni istemiyorsa?"
        ];

        let clickCount = 0;
        const msgDiv = document.getElementById("secret-message");

        function triggerHomeAction() {
            let selectedLine = "";

            // İlk iki basışta garanti sırayı çalıştır
            if (clickCount < initialLines.length) {
                selectedLine = initialLines[clickCount];
                clickCount++;
            } 
            // Tüm havuz bittiyse verilecek net son karar
            else if (homeParadoxPool.length === 0) {
                msgDiv.style.opacity = 0;
                setTimeout(() => {
                    msgDiv.textContent = "Eve gidemezsin, çünkü her yerdesin.";
                    msgDiv.style.opacity = 1;
                }, 150);
                return;
            } 
            // Sıralı aşama geçildiyse havuzdan rastgele çek ve tüket
            else {
                const randomIndex = Math.floor(Math.random() * homeParadoxPool.length);
                selectedLine = homeParadoxPool.splice(randomIndex, 1)[0];
            }
            
            // Yumuşak animasyon geçişi ile ekrana yansıtma
            msgDiv.style.opacity = 0;
            setTimeout(() => {
                msgDiv.textContent = selectedLine;
                msgDiv.style.opacity = 1;
            }, 150);
        }
    </script>

</body>
</html>
