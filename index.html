<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quunix</title>

<link rel="icon" href="pp.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:Inter, sans-serif;
  color:white;
  background:#000;
  user-select: none;
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:url("banner.png") center/cover no-repeat;
  filter:brightness(0.2) grayscale(1) blur(3px); 
  transform:scale(1.08);
  z-index: 1;
}

.overlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 60%),
    radial-gradient(circle at bottom, rgba(255,255,255,0.03), transparent 60%);
  z-index: 2;
}

/* CURSOR */
.cursor{
  position:fixed;
  width:10px;
  height:10px;
  background:#ffffff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 0 20px #ffffff, 0 0 40px #ffffff;
  z-index: 9999;
  transition: transform 0.1s ease;
}

/* PARILTI KUYRUĞU */
.trail-particle {
  position: fixed;
  pointer-events: none;
  font-size: 14px;
  z-index: 9998;
  opacity: 0.8;
  animation: fadeOut 0.6s linear forwards;
}

/* KALPLER KAPLAYICI */
.hearts-container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  z-index: 3;
  pointer-events: none;
}

/* KALP STİLİ */
.heart {
  position: absolute;
  font-size: 20px;
  color: #ffffff; 
  text-shadow: 0 0 10px #ffffff, 0 0 20px #888888;
  opacity: 0;
  animation: floatUp 4s linear infinite;
}

/* TIKLAMA KALPLERİ STİLİ */
.click-heart {
  position: fixed;
  pointer-events: none;
  font-size: 24px;
  z-index: 9997;
  animation: explode 0.8s ease-out forwards;
}

/* CENTER WRAPPER */
.wrap{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:25px; 
  text-align:center;
  z-index: 4;
}

/* PROFILE */
.pfp{
  width:190px;
  height:190px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ffffff;
  filter: grayscale(1); 
  box-shadow: 0 0 30px #ffffff, 0 0 90px rgba(255,255,255,0.2);
  animation: pulse 3s infinite ease-in-out;
  transition: filter 0.5s ease, transform 0.5s ease, box-shadow 0.5s ease;
  cursor: pointer;
}

.pfp:hover {
  filter: grayscale(0); 
  transform: scale(1.06) rotate(5deg);
  box-shadow: 0 0 40px #ffffff, 0 0 100px rgba(255, 255, 255, 0.6);
}

/* NAME WRAPPER */
.brand-titles {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* NAME */
.name{
  font-family:Orbitron, sans-serif;
  font-size:55px;
  font-weight:900;
  letter-spacing:8px;
  color:#999999;
  text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

/* WISTERAI SUBTITLE (Daha Belirgin ve Parlak) */
.subtitle {
  font-family: Orbitron, sans-serif;
  font-size: 38px; 
  font-weight: 900; 
  letter-spacing: 20px; 
  text-transform: uppercase;
  color: #ffffff; 
  margin-left: 20px;
  position: relative;
  animation: glowText 2s ease-in-out infinite alternate;
}

/* SEVGİLİ NOTU */
.love-note {
  font-size: 13px;
  font-style: italic;
  color: #888888;
  letter-spacing: 2px;
  max-width: 450px;
  line-height: 1.5;
  transition: color 0.3s, text-shadow 0.3s;
  margin-top: -5px;
}
.love-note:hover {
  color: #ffffff;
  text-shadow: 0 0 8px #ffffff;
}

/* SPOTIFY */
.spotify{
  width:550px;
  border-radius:18px;
  overflow:hidden;
  filter: grayscale(1);
  box-shadow: 0 0 30px rgba(255,255,255,0.1);
  transition: filter 0.5s ease, box-shadow 0.5s ease;
}
.spotify:hover {
  filter: grayscale(0.2);
  box-shadow: 0 0 40px rgba(255,255,255,0.2);
}

/* MÜZİK RİTMİ SİMÜLATÖRÜ (Audio Visualizer Effect) */
.visualizer {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 4px;
  height: 25px;
  margin-top: -10px;
}
.bar {
  width: 3px;
  height: 5px;
  background: rgba(255, 255, 255, 0.4);
  animation: bounce 0.5s ease-in-out infinite alternate;
}
.bar:nth-child(2) { animation-delay: 0.1s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.15s; }
.bar:nth-child(5) { animation-delay: 0.3s; }

/* GİZLİ MEKTUP KUTUSU (Modal) */
.love-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  width: 350px;
  background: rgba(10, 10, 10, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  z-index: 10000;
  opacity: 0;
  pointer-events: none;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.love-modal.active {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.love-modal h3 {
  font-family: Orbitron, sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  margin-bottom: 15px;
  color: #fff;
}
.love-modal p {
  font-size: 14px;
  color: #ccc;
  line-height: 1.6;
  font-style: italic;
}
.close-modal-btn {
  margin-top: 20px;
  background: none;
  border: 1px solid #fff;
  color: #fff;
  padding: 6px 18px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 1px;
  transition: all 0.3s;
}
.close-modal-btn:hover {
  background: #fff;
  color: #000;
}

/* ANIMATIONS */
@keyframes glowText {
  0% {
    text-shadow: 
      0 0 15px #ffffff,
      0 0 30px rgba(255, 255, 255, 0.7),
      0 0 50px rgba(255, 255, 255, 0.3);
  }
  100% {
    text-shadow: 
      0 0 25px #ffffff,
      0 0 50px rgba(255, 255, 255, 0.9),
      0 0 80px rgba(255, 255, 255, 0.5);
  }
}

@keyframes bounce {
  0% { height: 5px; opacity: 0.3; }
  100% { height: 25px; opacity: 1; }
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    box-shadow: 0 0 30px #ffffff, 0 0 80px rgba(255,255,255,0.25);
  }
  50%{
    transform:scale(1.03);
    box-shadow: 0 0 45px #ffffff, 0 0 110px rgba(255,255,255,0.4);
  }
}

@keyframes floatUp {
  0% {
    transform: translateY(105vh) scale(0.5) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: 0.5; }
  90% { opacity: 0.5; }
  100% {
    transform: translateY(-10vh) scale(1.1) rotate(360deg);
    opacity: 0;
  }
}

@keyframes fadeOut {
  0% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
}

@keyframes explode {
  0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
  100% {
    transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot));
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<div class="cursor" id="cursor"></div>
<div class="hearts-container" id="heartsContainer"></div>

<!-- Gizli Mektup Penceresi (Modal) -->
<div class="love-modal" id="loveModal">
  <h3>Sude'm için bir not 🖤</h3>
  <p>"Siyah beyaz olan bu dünyamda, benim için parıldayan tek şeysin. İyi ki varsın..."</p>
  <button class="close-modal-btn" id="closeModalBtn">Kapat</button>
</div>

<div class="wrap">

  <!-- Profil fotoğrafına tıklayınca gizli mektup açılır -->
  <img src="pp.png" class="pfp" id="pfpImg" title="Tıkla...">

  <div class="brand-titles">
    <div class="name">Quunix</div>
    <div class="subtitle">Wisterai</div>
  </div>

  <div class="love-note">
    "S♡"
  </div>

  <div class="spotify">
    <iframe 
      style="border-radius:12px" 
      src="https://open.spotify.com/embed/playlist/55AzvgCu5D4WubbdPx1VOa?utm_source=generator&theme=0" 
      width="100%" height="220" 
      frameborder="0" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

  <!-- Ritme göre zıplayan ses çubukları -->
  <div class="visualizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

</div>

<script>
// Özel İmleç Takibi
const cursor = document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
  createTrail(e.clientX, e.clientY); // Parıltı kuyruğu efekti tetikleniyor
});

// İmleç Tıklama Küçülmesi
document.addEventListener("mousedown", () => { cursor.style.transform = "translate(-50%,-50%) scale(0.7)"; });
document.addEventListener("mouseup", () => { cursor.style.transform = "translate(-50%,-50%) scale(1)"; });

// İMLEÇ ARKASI PARILTI KUYRUĞU FONKSİYONU
const trailStyles = ['✨', '🤍', '·'];
function createTrail(x, y) {
  // Aşırı yoğun olmaması için rastgele oranda üretilsin
  if (Math.random() > 0.15) return; 
  
  const p = document.createElement("div");
  p.classList.add("trail-particle");
  p.innerText = trailStyles[Math.floor(Math.random() * trailStyles.length)];
  p.style.left = x + "px";
  p.style.top = y + "px";
  
  document.body.appendChild(p);
  setTimeout(() => { p.remove(); }, 600);
}

// ARKA PLAN KALPLERİ
const container = document.getElementById("heartsContainer");
const heartStyles = ['🤍', '🖤', '🤍', '☁️']; 

function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = heartStyles[Math.floor(Math.random() * heartStyles.length)];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = Math.random() * 2 + 3 + "s"; 
  
  const size = Math.random() * 12 + 12; 
  heart.style.fontSize = size + "px";
  
  container.appendChild(heart);
  setTimeout(() => { heart.remove(); }, 4000);
}
setInterval(createHeart, 180);

// TIKLAMA EFEKTİ (Etrafa Patlayan Kalpler)
document.addEventListener("click", (e) => {
  // Eğer modala veya kapatma butonuna tıklandıysa efekti yapmasın
  if (e.target.closest('#loveModal')) return;

  const particleCount = 6;
  const clickStyles = ['🤍', '🖤', '✨', '❤️']; 
  
  for (let i = 0; i < particleCount; i++) {
    const p = document.createElement("div");
    p.classList.add("click-heart");
    p.innerText = clickStyles[Math.floor(Math.random() * clickStyles.length)];
    
    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 80 + 40; 
    const tx = Math.cos(angle) * velocity - 50 + "%";
    const ty = Math.sin(angle) * velocity - 50 + "%";
    const rot = Math.random() * 360 + "deg";
    
    p.style.setProperty('--tx', tx);
    p.style.setProperty('--ty', ty);
    p.style.setProperty('--rot', rot);
    
    p.style.left = e.clientX + "px";
    p.style.top = e.clientY + "px";
    
    document.body.appendChild(p);
    setTimeout(() => { p.remove(); }, 800);
  }
});

// INTERAKTIF GIZLI MEKTUP KUTUSU (MODAL) TETIKLEYICILERI
const pfp = document.getElementById("pfpImg");
const modal = document.getElementById("loveModal");
const closeBtn = document.getElementById("closeModalBtn");

pfp.addEventListener("click", () => {
  modal.classList.add("active");
});

closeBtn.addEventListener("click", () => {
  modal.classList.remove("active");
});
</script>

</body>
</html>
