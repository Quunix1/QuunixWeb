```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quunix</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030305;
        font-family: Arial, Helvetica, sans-serif;
        cursor: none;
    }

    body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ANA ARKA PLAN */
    body::before {
        content: "";
        position: fixed;
        inset: -50%;
        background:
            radial-gradient(
                circle at var(--mx, 50%) var(--my, 50%),
                rgba(120, 70, 255, 0.16) 0%,
                rgba(80, 40, 180, 0.07) 12%,
                transparent 32%
            );
        pointer-events: none;
        z-index: 0;
        transition: background 0.15s ease;
    }

    /* Hafif grid */
    .grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0.16;
        background-image:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle, black 10%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle, black 10%, transparent 80%);
    }

    /* ORTADAKİ IŞIK */
    .center-glow {
        position: fixed;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: rgba(110, 55, 255, 0.08);
        filter: blur(100px);
        z-index: 0;
        pointer-events: none;
        animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
        0%, 100% {
            transform: scale(0.85);
            opacity: 0.5;
        }
        50% {
            transform: scale(1.15);
            opacity: 1;
        }
    }

    /* PARÇACIKLAR */
    .particles {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
    }

    .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(180, 150, 255, 0.8);
        box-shadow:
            0 0 8px rgba(130, 80, 255, 0.8),
            0 0 18px rgba(100, 50, 255, 0.4);
        animation: float linear infinite;
    }

    @keyframes float {
        from {
            transform: translateY(110vh) translateX(0);
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        90% {
            opacity: 1;
        }
        to {
            transform: translateY(-10vh) translateX(60px);
            opacity: 0;
        }
    }

    /* LOGO */
    .logo-wrap {
        position: relative;
        z-index: 5;
        text-align: center;
        user-select: none;
    }

    .logo {
        position: relative;
        display: inline-block;

        font-size: clamp(90px, 15vw, 250px);
        font-weight: 900;
        letter-spacing: -0.075em;
        line-height: 0.8;

        color: #f7f4ff;

        text-shadow:
            0 0 8px rgba(255,255,255,0.7),
            0 0 25px rgba(150,100,255,0.8),
            0 0 55px rgba(120,70,255,0.55),
            0 0 110px rgba(90,40,255,0.35);

        transition:
            transform 0.25s cubic-bezier(.2,.8,.2,1),
            text-shadow 0.25s ease;
    }

    /* IŞIKLI YAZI KATMANI */
    .logo::before {
        content: "quunix";
        position: absolute;
        inset: 0;

        color: transparent;
        -webkit-text-stroke: 1px rgba(180,140,255,0.7);

        filter: blur(5px);
        opacity: 0.8;

        z-index: -1;
    }

    /* PARLAKLIK GEÇİŞİ */
    .logo::after {
        content: "quunix";
        position: absolute;
        inset: 0;

        color: transparent;
        background: linear-gradient(
            110deg,
            transparent 25%,
            rgba(255,255,255,0.9) 45%,
            rgba(190,150,255,1) 50%,
            transparent 70%
        );

        background-size: 250% 100%;
        background-position: 200% 0;

        -webkit-background-clip: text;
        background-clip: text;

        animation: shine 5s ease-in-out infinite;

        pointer-events: none;
    }

    @keyframes shine {
        0%, 65% {
            background-position: 200% 0;
        }
        85%, 100% {
            background-position: -100% 0;
        }
    }

    /* MOUSE */
    .cursor {
        position: fixed;
        left: 0;
        top: 0;

        width: 9px;
        height: 9px;
        border-radius: 50%;

        background: white;

        box-shadow:
            0 0 8px white,
            0 0 20px #9d6cff,
            0 0 45px #713cff,
            0 0 80px rgba(110,60,255,0.7);

        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
    }

    .cursor-glow {
        position: fixed;
        left: 0;
        top: 0;

        width: 260px;
        height: 260px;

        border-radius: 50%;

        background: radial-gradient(
            circle,
            rgba(120,70,255,0.18) 0%,
            rgba(100,50,255,0.08) 25%,
            transparent 70%
        );

        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 2;

        filter: blur(4px);
    }

    /* MOUSE HARE */
    .trail {
        position: fixed;
        width: 5px;
        height: 5px;
        border-radius: 50%;

        background: rgba(160,120,255,0.8);

        box-shadow:
            0 0 8px rgba(150,100,255,0.9),
            0 0 20px rgba(100,50,255,0.6);

        pointer-events: none;
        z-index: 3;

        transform: translate(-50%, -50%);
        animation: trailFade 0.7s forwards;
    }

    @keyframes trailFade {
        0% {
            opacity: 0.8;
            transform: translate(-50%, -50%) scale(1);
        }
        100% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
        }
    }

    /* EKRAN KENARLARINDA VIGNETTE */
    .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;

        box-shadow:
            inset 0 0 180px rgba(0,0,0,0.85),
            inset 0 0 50px rgba(0,0,0,0.5);
    }

    /* HAFİF GLITCH */
    .logo.glitch {
        animation: glitch 0.2s linear;
    }

    @keyframes glitch {
        0% {
            transform: translate(0);
        }
        20% {
            transform: translate(-3px, 1px);
        }
        40% {
            transform: translate(3px, -1px);
        }
        60% {
            transform: translate(-2px, 0);
        }
        80% {
            transform: translate(2px, 1px);
        }
        100% {
            transform: translate(0);
        }
    }

    /* MOBİL */
    @media (max-width: 600px) {
        html, body {
            cursor: auto;
        }

        .cursor,
        .cursor-glow {
            display: none;
        }

        .logo {
            font-size: 25vw;
        }

        .grid {
            background-size: 35px 35px;
        }
    }
</style>
</head>

<body>

<div class="grid"></div>
<div class="center-glow"></div>
<div class="particles"></div>

<div class="logo-wrap">
    <div class="logo" id="logo">quunix</div>
</div>

<div class="cursor-glow" id="cursorGlow"></div>
<div class="cursor" id="cursor"></div>

<div class="vignette"></div>

<script>
    /* -------------------------
       PARÇACIKLAR
    ------------------------- */
    const particles = document.querySelector(".particles");

    for (let i = 0; i < 65; i++) {
        const p = document.createElement("div");
        p.className = "particle";

        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (8 + Math.random() * 18) + "s";
        p.style.animationDelay = (-Math.random() * 20) + "s";

        const size = Math.random() * 2.5 + 1;
        p.style.width = size + "px";
        p.style.height = size + "px";

        particles.appendChild(p);
    }

    /* -------------------------
       MOUSE
    ------------------------- */
    const cursor = document.getElementById("cursor");
    const cursorGlow = document.getElementById("cursorGlow");
    const logo = document.getElementById("logo");

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    let glowX = mouseX;
    let glowY = mouseY;

    document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        cursor.style.left = mouseX + "px";
        cursor.style.top = mouseY + "px";

        document.documentElement.style.setProperty(
            "--mx",
            (mouseX / window.innerWidth * 100) + "%"
        );

        document.documentElement.style.setProperty(
            "--my",
            (mouseY / window.innerHeight * 100) + "%"
        );

        /* Logo hafif mouse'a doğru eğilsin */
        const x = (mouseX / window.innerWidth - 0.5) * 14;
        const y = (mouseY / window.innerHeight - 0.5) * 8;

        logo.style.transform =
            `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    /* Glow daha yavaş takip etsin */
    function animateGlow() {
        glowX += (mouseX - glowX) * 0.075;
        glowY += (mouseY - glowY) * 0.075;

        cursorGlow.style.left = glowX + "px";
        cursorGlow.style.top = glowY + "px";

        requestAnimationFrame(animateGlow);
    }

    animateGlow();

    /* -------------------------
       MOUSE TRAIL
    ------------------------- */
    let lastTrail = 0;

    document.addEventListener("mousemove", (e) => {
        const now = Date.now();

        if (now - lastTrail < 35) return;

        lastTrail = now;

        const trail = document.createElement("div");
        trail.className = "trail";

        trail.style.left = e.clientX + "px";
        trail.style.top = e.clientY + "px";

        document.body.appendChild(trail);

        setTimeout(() => {
            trail.remove();
        }, 700);
    });

    /* -------------------------
       NADİR GLITCH
    ------------------------- */
    setInterval(() => {
        if (Math.random() > 0.55) {
            logo.classList.add("glitch");

            setTimeout(() => {
                logo.classList.remove("glitch");
            }, 200);
        }
    }, 4500);

    /* -------------------------
       TIKLAYINCA PARLAMA
    ------------------------- */
    document.addEventListener("click", () => {
        logo.style.textShadow = `
            0 0 10px white,
            0 0 30px white,
            0 0 70px #9d6cff,
            0 0 140px #713cff,
            0 0 220px rgba(100,50,255,0.8)
        `;

        setTimeout(() => {
            logo.style.textShadow = "";
        }, 450);
    });
</script>

</body>
</html>
