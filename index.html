<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quunix</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  user-select: none;
}

/* GÖZ SİMGESİ */
.eye-container {
  width: 100px;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* GÖZÜN DIŞ ÇERÇEVESİ */
.eye-ball {
  width: 100%;
  height: 100%;
  border: 3px solid #ffffff;
  border-radius: 50% 0;
  transform: rotate(45deg);
  display: flex;
  justify-content: center;
  align-items: center;
  transition: box-shadow 0.3s ease;
}

/* GÖZ BEBEĞİ */
.pupil {
  width: 32px;
  height: 32px;
  background: #ffffff;
  border-radius: 50%;
}

/* Hafif bir derinlik için hover efekti */
.eye-container:hover .eye-ball {
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
}
</style>
</head>
<body>

  <div class="eye-container">
    <div class="eye-ball">
      <div class="pupil"></div>
    </div>
  </div>

</body>
</html>
