<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="quunix">
  <title>quunix</title>
  <style>
    :root {
      --ice: #dcecff;
      --muted: rgba(224,235,255,.68);
      --line: rgba(211,230,255,.18);
      --glass: rgba(10, 20, 39, .43);
      --blue: #9acaff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; color: var(--ice);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827 url("arkaplan.png") center center / cover fixed no-repeat;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        linear-gradient(180deg, rgba(7,15,30,.32) 0%, rgba(7,14,29,.28) 40%, rgba(4,10,22,.72) 100%),
        radial-gradient(ellipse at 50% 42%, transparent 0%, rgba(5,12,26,.28) 75%);
    }
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
    }
    .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; width: 38vw; height: 38vw; min-width: 260px; min-height: 260px; border-radius: 50%;
      filter: blur(95px); opacity: .14; background: #5da9ff; animation: drift 18s ease-in-out infinite alternate; }
    .orb.one { left: -12vw; top: 4vh; }
    .orb.two { right: -14vw; bottom: -10vh; background: #b4a4ff; animation-delay: -8s; }
    @keyframes drift { to { transform: translate(7vw, 4vh) scale(1.12); } }
    .topbar {
      position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center;
      padding: 28px clamp(20px, 5vw, 72px);
    }
    .brand { display: flex; gap: 11px; align-items: center; color: #eff6ff; text-decoration: none; font-size: 14px; letter-spacing: .13em; font-weight: 750; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 10px; background: rgba(230,242,255,.09); box-shadow: inset 0 0 15px rgba(255,255,255,.05); }
    .status { display: flex; align-items: center; gap: 9px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; background: rgba(8,17,34,.35); backdrop-filter: blur(14px); color: var(--muted); font-size: 11px; letter-spacing: .07em; }
    .status-dot { width: 7px; height: 7px; background: #a9d8ff; border-radius: 50%; box-shadow: 0 0 12px #83c4ff; animation: pulse 2.3s infinite; }
    @keyframes pulse { 50% { opacity: .35; box-shadow: 0 0 3px #83c4ff; } }
    main { min-height: calc(100vh - 155px); display: grid; place-items: center; padding: 28px 18px 56px; }
    .profile { width: min(440px, 100%); text-align: center; animation: rise .9s cubic-bezier(.2,.75,.25,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .eyebrow { display: flex; justify-content: center; align-items: center; gap: 10px; color: rgba(225,238,255,.68); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; margin-bottom: 14px; }
    .eyebrow::before, .eyebrow::after { content: ""; width: 24px; height: 1px; background: rgba(214,233,255,.45); }
    h1 { margin: 0; font-size: clamp(58px, 12vw, 92px); line-height: .98; font-weight: 780; letter-spacing: -.075em;
      color: #f1f7ff; text-shadow: 0 5px 45px rgba(130,185,255,.32); }
    h1 span { color: #b7d9ff; }
    .subtitle { margin: 17px 0 28px; color: rgba(226,237,255,.78); font-size: 13px; letter-spacing: .035em; }
    .divider { height: 1px; width: 44px; margin: 0 auto 24px; background: linear-gradient(90deg, transparent, rgba(202,227,255,.75), transparent); }
    .music-card {
      display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; padding: 13px;
      border: 1px solid rgba(218,234,255,.22); border-radius: 19px;
      background: linear-gradient(135deg, rgba(14,26,48,.76), rgba(10,19,36,.51));
      box-shadow: 0 18px 65px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.07);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    }
    .cover-wrap { width: 64px; height: 64px; flex: 0 0 64px; position: relative; }
    .cover { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; background: linear-gradient(135deg,#263e60,#121b30); box-shadow: 0 5px 20px rgba(0,0,0,.25); }
    .track-info { min-width: 0; flex: 1; }
    .track-label { font-size: 9px; letter-spacing: .18em; color: #a8cfff; text-transform: uppercase; margin-bottom: 6px; }
    .track-title { font-size: 13px; font-weight: 650; color: #f1f6ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .play {
      display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px; border: 1px solid rgba(225,239,255,.23);
      border-radius: 50%; color: #f5f9ff; background: rgba(203,226,255,.12); cursor: pointer;
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .play:hover { transform: scale(1.06); background: rgba(190,220,255,.23); box-shadow: 0 0 22px rgba(132,190,255,.17); }
    .play svg { width: 15px; height: 15px; fill: currentColor; }
    .music-bottom { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .time { color: rgba(218,232,255,.56); font-size: 9px; font-variant-numeric: tabular-nums; min-width: 28px; }
    .progress { appearance: none; -webkit-appearance: none; height: 3px; flex: 1; background: rgba(215,232,255,.2); border-radius: 99px; outline: none; cursor: pointer; }
    .progress::-webkit-slider-thumb { appearance: none; width: 7px; height: 7px; background: #d8eaff; border-radius: 50%; box-shadow: 0 0 8px rgba(170,210,255,.6); }
    .progress::-moz-range-thumb { width: 7px; height: 7px; background: #d8eaff; border: 0; border-radius: 50%; }
    .volume-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 17px 2px 0; color: rgba(225,237,255,.68); }
    .volume-row svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
    .volume { max-width: 120px; flex: 1; accent-color: #c1ddff; height: 3px; cursor: pointer; }
    .volume-value { width: 29px; text-align: right; font-size: 10px; color: rgba(225,237,255,.62); font-variant-numeric: tabular-nums; }
    .hint { margin: 22px 0 0; color: rgba(224,237,255,.54); font-size: 10px; letter-spacing: .06em; }
    .hint .spark { color: #c4e1ff; margin-right: 5px; }
    footer { position: relative; z-index: 2; padding: 0 20px 24px; text-align: center; color: rgba(218,232,255,.43); font-size: 10px; letter-spacing: .12em; }
    .toast { min-height: 16px; color: #c6dfff; font-size: 10px; margin-top: 9px; opacity: .85; }
    @media (max-width: 520px) {
      body { background-attachment: scroll; background-position: 53% center; }
      .topbar { padding: 20px 18px; }
      main { min-height: calc(100svh - 120px); padding-bottom: 42px; }
      .music-card { gap: 11px; padding: 11px; }
      .cover-wrap { width: 57px; height: 57px; flex-basis: 57px; }
      .status { font-size: 9px; padding: 8px 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="orb one"></div><div class="orb two"></div></div>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="quunix ana sayfa"><span class="brand-mark">q.</span> Q U U N I X</a>
  </header>

  <main>
    <section class="profile" aria-label="quunix profili">
      <h1>quu<span>nix</span></h1>
      <div class="divider"></div>

      <section class="music-card" aria-label="Müzik oynatıcı">
        <div class="cover-wrap">
          <img class="cover" src="muzikfoto.png" alt="Şarkı kapak görseli" onerror="this.style.opacity='.2'">
        </div>
        <div class="track-info">
          <div class="track-label">NOW PLAYING · YOUR MUSIC</div>
          <div class="track-title">Anlamazdın</div>
          <div class="track-artist">Ayla Dikmen</div>
          <div class="music-bottom">
            <span class="time" id="currentTime">0:00</span>
            <input class="progress" id="progress" type="range" min="0" max="100" value="0" step=".1" aria-label="Şarkı konumu">
            <span class="time" id="duration">0:00</span>
          </div>
        </div>
        <button class="play" id="playButton" aria-label="Müziği oynat" title="Oynat / duraklat">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l10 6.2a1 1 0 0 1 0 1.7l-10 6.2A1.05 1.05 0 0 1 8 18.1V5.8z"/></svg>
        </button>
      </section>

      <div class="volume-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zm-2.5-9.1v2.06a7 7 0 0 1 0 14.08v2.06a9.05 9.05 0 0 0 0-18.2z"/></svg>
        <input class="volume" id="volume" type="range" min="0" max="1" value="0.12" step="0.01" aria-label="Ses seviyesi">
        <span class="volume-value" id="volumeValue">12%</span>
      </div>
      <audio id="audio" preload="metadata" loop>
        <source src="./muzik1.opus" type="audio/ogg; codecs=opus">
      </audio>
    </section>
  </main>


<script>
const audio = document.getElementById('audio');
const playButton = document.getElementById('playButton');
const playIcon = document.getElementById('playIcon');
const volume = document.getElementById('volume');
const volumeValue = document.getElementById('volumeValue');
const progress = document.getElementById('progress');
const currentTime = document.getElementById('currentTime');
const duration = document.getElementById('duration');

audio.volume = 0.12;
let seeking = false;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function setPlayingUI(playing) {
  playIcon.innerHTML = playing
    ? '<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>'
    : '<path d="M8 5.8c0-.8.9-1.3 1.6-.9l10 6.2a1 1 0 0 1 0 1.7l-10 6.2A1.05 1.05 0 0 1 8 18.1V5.8z"/>';

  playButton.setAttribute(
    'aria-label',
    playing ? 'Müziği duraklat' : 'Müziği oynat'
  );
}

playButton.addEventListener('click', async () => {
  if (audio.paused) {
    try {
      await audio.play();
      setPlayingUI(true);
    } catch (error) {
      console.error('Müzik başlatılamadı:', error);
      setPlayingUI(false);
    }
  } else {
    audio.pause();
    setPlayingUI(false);
  }
});

volume.addEventListener('input', () => {
  audio.volume = Number(volume.value);
  volumeValue.textContent = `${Math.round(audio.volume * 100)}%`;
});

audio.addEventListener('loadedmetadata', () => {
  duration.textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  currentTime.textContent = formatTime(audio.currentTime);

  if (!seeking && Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
});

progress.addEventListener('input', () => {
  seeking = true;
});

progress.addEventListener('change', () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(progress.value) / 100) * audio.duration;
  }
  seeking = false;
});

audio.addEventListener('play', () => setPlayingUI(true));
audio.addEventListener('pause', () => setPlayingUI(false));
</script>

</body>
</html>
