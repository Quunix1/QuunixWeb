<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quunix</title>

<link rel="icon" href="pp.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:Inter;
  color:white;
  background:#000;
}

/* BACKGROUND (Siyah-Beyaz Filtre Eklendi) */
.bg{
  position:fixed;
  inset:0;
  background:url("banner.png") center/cover no-repeat;
  filter:brightness(0.25) grayscale(1) blur(2px); /* Tamamen siyah beyaz ve biraz daha koyu */
  transform:scale(1.08);
  z-index: 1;
}

.overlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.1), transparent 60%),
    radial-gradient(circle at bottom, rgba(255,255,255,0.05), transparent 60%);
  z-index: 2;
}

/* CURSOR (Siyah-Beyaz Temaya Uygun) */
.cursor{
  position:fixed;
  width:10px;
  height:10px;
  background:#ffffff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 0 20px #ffffff, 0 0 40px #ffffff;
  z-index: 9999;
}

/* KALPLER KAPLAYICI */
.hearts-container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  z-index: 3;
  pointer-events: none;
}

/* KALP STİLİ (Siyah-Beyaz & Gri Tonları) */
.heart {
  position: absolute;
  font-size: 20px;
  color: #ffffff; 
  text-shadow: 0 0 10px #ffffff, 0 0 20px #888888;
  opacity: 0;
  animation: floatUp 5s linear infinite; /* Kalpler daha hızlı aksın diye 5s yapıldı */
}

/* CENTER */
.wrap{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:25px; 
  text-align:center;
  z-index: 4;
}

/* PROFILE */
.pfp{
  width:210px;
  height:210px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ffffff;
  filter: grayscale(1); /* Profil fotoğrafını da siyah beyaz yapar */

  box-shadow:
    0 0 30px #ffffff,
    0 0 90px rgba(255,255,255,0.3);

  animation:pulse 3s infinite ease-in-out;
}

/* NAME WRAPPER */
.brand-titles {
  display: flex;
  flex-direction: column;
  gap: 10px; /* Alt başlık için aralık biraz açıldı */
}

/* NAME */
.name{
  font-family:Orbitron, sans-serif;
  font-size:75px; /* Subtitle'ı öne çıkarmak için hafif küçültüldü */
  font-weight:900;
  letter-spacing:6px;
  color:#aaaaaa; /* İsmi hafif griye çekerek alttaki metni patlattık */

  text-shadow:
    0 0 10px rgba(255,255,255,0.3);
}

/* WISTERIA SUBTITLE (Ön Plana Çıkarıldı) */
.subtitle {
  font-family: Orbitron, sans-serif;
  font-size: 32px; /* Boyutu büyütüldü */
  font-weight: 900; /* Kalınlaştırıldı */
  letter-spacing: 16px; /* Harf arası açıldı */
  text-transform: uppercase;
  color: #ffffff; /* Tam beyaz yapıldı */
  text-shadow: 
    0 0 15px #ffffff,
    0 0 35px rgba(255, 255, 255, 0.8),
    0 0 60px rgba(255, 255, 255, 0.4);
  margin-left: 16px; 
}

/* SPOTIFY */
.spotify{
  width:650px;
  border-radius:18px;
  overflow:hidden;
  filter: grayscale(1); /* Spotify kutusunu temaya uydurur */

  box-shadow:
    0 0 40px rgba(255,255,255,0.15);
}

/* ANIMATIONS */
@keyframes pulse{
  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 30px #ffffff,
      0 0 80px rgba(255,255,255,0.25);
  }
  50%{
    transform:scale(1.04);
    box-shadow:
      0 0 50px #ffffff,
      0 0 120px rgba(255,255,255,0.45);
  }
}

@keyframes floatUp {
  0% {
    transform: translateY(105vh) scale(0.5) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 0.6;
  }
  90% {
    opacity: 0.6;
  }
  100% {
    transform: translateY(-10vh) scale(1.2) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<div class="cursor" id="cursor"></div>
<div class="hearts-container" id="heartsContainer"></div>

<div class="wrap">

  <img src="pp.png" class="pfp">

  <div class="brand-titles">
    <div class="name">Quunix</div>
    <div class="subtitle">Wisterai</div>
  </div>

  <div class="spotify">
    <iframe 
      style="border-radius:12px" 
      src="https://open.spotify.com/embed/playlist/55AzvgCu5D4WubbdPx1VOa?utm_source=generator&theme=0" 
      width="100%" height="352" 
      frameborder="0" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

</div>

<script>
// Özel İmleç Takibi
const cursor=document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

// Arka Plan Kalp Efekti (Siyah-Beyaz Emojiler)
const container = document.getElementById("heartsContainer");
const heartStyles = ['🤍', '🖤', '🖤', '🤍']; // Renkli kalpler yerine siyah-beyaz kalpler

function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  
  heart.innerText = heartStyles[Math.floor(Math.random() * heartStyles.length)];
  
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = Math.random() * 2 + 3 + "s"; // Süzülme hızı artırıldı (3-5 sn)
  
  const size = Math.random() * 15 + 12; // Kalplerin boyut aralığı
  heart.style.fontSize = size + "px";
  
  container.appendChild(heart);
  
  setTimeout(() => {
    heart.remove();
  }, 5000);
}

// Kalplerin çoğalması için süre 400ms'den 150ms'ye düşürüldü (Çok daha sık çıkarlar)
setInterval(createHeart, 150);
</script>

</body>
</html>
