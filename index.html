<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quunix</title>

<link rel="icon" href="pp.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:Inter;
  color:white;
  background:#000;
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:url("banner.png") center/cover no-repeat;
  filter:brightness(0.35) saturate(1.3) blur(2px);
  transform:scale(1.08);
  z-index: 1;
}

.overlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(0,200,255,0.25), transparent 60%),
    radial-gradient(circle at bottom, rgba(120,220,255,0.15), transparent 60%);
  z-index: 2;
}

/* CURSOR */
.cursor{
  position:fixed;
  width:10px;
  height:10px;
  background:#7dd3fc;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 0 20px #38bdf8;
  z-index: 9999;
}

/* KALPLER KAPLAYICI */
.hearts-container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  z-index: 3;
  pointer-events: none;
}

/* KALP STİLİ */
.heart {
  position: absolute;
  font-size: 20px;
  color: #f472b6; /* Neon Pembe/Mor tonu */
  text-shadow: 0 0 10px #f472b6, 0 0 20px #ec4899;
  opacity: 0;
  animation: floatUp 6s linear infinite;
}

/* CENTER */
.wrap{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:25px; /* Elemanlar arası boşluk biraz daraltıldı */
  text-align:center;
  z-index: 4;
}

/* PROFILE */
.pfp{
  width:210px;
  height:210px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #7dd3fc;

  box-shadow:
    0 0 30px #38bdf8,
    0 0 90px rgba(56,189,248,0.45);

  animation:pulse 3s infinite ease-in-out;
}

/* NAME WRAPPER */
.brand-titles {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* NAME */
.name{
  font-family:Orbitron, sans-serif;
  font-size:80px;
  font-weight:900;
  letter-spacing:6px;
  color:#7dd3fc;

  text-shadow:
    0 0 10px #38bdf8,
    0 0 35px #38bdf8,
    0 0 80px rgba(56,189,248,0.6);
}

/* WISTERIA SUBTITLE */
.subtitle {
  font-family: Orbitron, sans-serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 12px;
  text-transform: uppercase;
  color: #c084fc; /* Wisteria çiçeği rengine yakın neon mor */
  text-shadow: 
    0 0 10px #a855f7,
    0 0 25px rgba(168, 85, 247, 0.5);
  margin-left: 12px; /* Letter-spacing dengelemek için */
}

/* SPOTIFY */
.spotify{
  width:650px;
  border-radius:18px;
  overflow:hidden;

  box-shadow:
    0 0 40px rgba(56,189,248,0.25),
    0 0 90px rgba(56,189,248,0.15);
}

/* ANIMATIONS */
@keyframes pulse{
  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 30px #38bdf8,
      0 0 80px rgba(56,189,248,0.35);
  }
  50%{
    transform:scale(1.04);
    box-shadow:
      0 0 50px #38bdf8,
      0 0 120px rgba(56,189,248,0.55);
  }
}

@keyframes floatUp {
  0% {
    transform: translateY(105vh) scale(0.5) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 0.7;
  }
  90% {
    opacity: 0.7;
  }
  100% {
    transform: translateY(-10vh) scale(1.2) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<div class="cursor" id="cursor"></div>
<div class="hearts-container" id="heartsContainer"></div>

<div class="wrap">

  <img src="pp.png" class="pfp">

  <div class="brand-titles">
    <div class="name">Quunix</div>
    <div class="subtitle">Wisterai</div>
  </div>

  <div class="spotify">
    <iframe 
      style="border-radius:12px" 
      src="https://open.spotify.com/embed/playlist/55AzvgCu5D4WubbdPx1VOa?utm_source=generator&theme=0" 
      width="100%" height="352" 
      frameborder="0" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

</div>

<script>
// Özel İleç Takibi
const cursor=document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

// Arka Plan Kalp Efekti
const container = document.getElementById("heartsContainer");
const heartStyles = ['❤️', '💜', '💖', '🖤']; 

function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  
  // Rastgele kalp ikonu seçimi
  heart.innerText = heartStyles[Math.floor(Math.random() * heartStyles.length)];
  
  // Rastgele yatay konum, boyut ve hız ayarları
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = Math.random() * 3 + 4 + "s"; // 4-7 saniye arası süzülme
  
  const size = Math.random() * 15 + 15; // 15px - 30px arası boyut
  heart.style.fontSize = size + "px";
  
  container.appendChild(heart);
  
  // Animasyon bitince elementi temizle
  setTimeout(() => {
    heart.remove();
  }, 7000);
}

// Belirli aralıklarla yeni kalp üret
setInterval(createHeart, 400);
</script>

</body>
</html>
