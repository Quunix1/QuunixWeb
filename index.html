<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quunix</title>
<meta name="description" content="Eve Gitmem Gerek Her Yerdeyim">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050505;
    font-family:'Segoe UI',sans-serif;
    position:relative;
}

/* Arka plan ışıkları */
.bg-glow{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    animation:float 10s infinite ease-in-out alternate;
}

.glow1{
    width:400px;
    height:400px;
    background:#00ffff;
    top:-100px;
    left:-100px;
}

.glow2{
    width:350px;
    height:350px;
    background:#ff00ff;
    bottom:-100px;
    right:-100px;
    animation-duration:12s;
}

.glow3{
    width:300px;
    height:300px;
    background:#6f00ff;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    animation-duration:8s;
}

@keyframes float{
    from{
        transform:translateY(-30px) scale(1);
    }
    to{
        transform:translateY(30px) scale(1.2);
    }
}

.container{
    text-align:center;
    z-index:2;
}

.title{
    font-size:5rem;
    font-weight:900;
    color:white;
    text-transform:uppercase;
    letter-spacing:8px;
    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff;
    animation:pulse 3s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.05);
        text-shadow:
            0 0 20px #ff00ff,
            0 0 40px #ff00ff,
            0 0 80px #ff00ff;
    }
}

.subtitle{
    color:#d7d7d7;
    margin-top:10px;
    font-size:1rem;
    letter-spacing:2px;
}

.countdown{
    margin-top:40px;
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.time-box{
    min-width:120px;
    padding:20px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    border-radius:20px;
    box-shadow:
        0 0 20px rgba(255,255,255,.1),
        inset 0 0 20px rgba(255,255,255,.05);
}

.time{
    font-size:3rem;
    color:white;
    font-weight:800;
}

.label{
    color:#cfcfcf;
    margin-top:5px;
    text-transform:uppercase;
    font-size:.8rem;
    letter-spacing:2px;
}

.particles{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:rise linear infinite;
}

@keyframes rise{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

.finished{
    color:white;
    font-size:2rem;
    font-weight:700;
}
</style>
</head>

<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>
<div class="bg-glow glow3"></div>

<div class="particles" id="particles"></div>

<div class="container">
    <h1 class="title">QUUNIX</h1>
    <p class="subtitle">Eve Gitmem Gerek Her Yerdeyim</p>

    <div class="countdown" id="countdown">
        <div class="time-box">
            <div class="time" id="days">0</div>
            <div class="label">Gün</div>
        </div>

        <div class="time-box">
            <div class="time" id="hours">0</div>
            <div class="label">Saat</div>
        </div>

        <div class="time-box">
            <div class="time" id="minutes">0</div>
            <div class="label">Dakika</div>
        </div>

        <div class="time-box">
            <div class="time" id="seconds">0</div>
            <div class="label">Saniye</div>
        </div>
    </div>
</div>

<script>
const targetDate = new Date("2026-06-27T00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0){
        document.getElementById("countdown").innerHTML =
            '<div class="finished">27 Haziran 2026 geldi.</div>';
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* Parçacıklar */
const particles = document.getElementById("particles");

for(let i=0;i<80;i++){
    const p = document.createElement("div");
    p.classList.add("particle");

    p.style.left = Math.random()*100 + "%";
    p.style.animationDuration = (5 + Math.random()*10) + "s";
    p.style.animationDelay = Math.random()*5 + "s";

    particles.appendChild(p);
}
</script>

</body>
</html>
